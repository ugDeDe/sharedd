[http]
# За Caddy-реверс-прокси достаточно loopback: ноды и панель ходят через https://домен.
addr = "127.0.0.1:8080"

[state]
file = "/var/lib/sharedd/registry_state.json"

# Встроенная веб-панель: /panel (HTML), /panel/api/overview, /panel/api/events.
# token защищает API панели и /status (Authorization: Bearer <token>).
# Пустой token = dev-режим без авторизации.
[panel]
enabled = true
token = ""
events_max = 500

[healthcheck]
probe_interval_ms = 5000
probe_timeout_ms = 3000
selection_interval_ms = 3000
heartbeat_ttl_sec = 60
# Гистерезис здоровья ПО ПОДРЯД идущим проверкам (защёлки, не мгновенные флаги):
#   fail_threshold    — сколько подряд неудач гасит ноду (TCP-пробы каждые
#                       probe_interval_ms; metrics-отчёты — каждые metrics_ms).
#   recover_threshold — сколько подряд удач возвращает её в строй.
# V7.9.4: metrics-здоровье — тоже защёлка: одиночный сбойный отчёт мастерство
# НЕ роняет. Отдельно действует report_freshness_min — dead-man's switch: если
# ЖИВАЯ нода (любые признаки жизни) молчит дольше этого срока — она вне строя,
# серии тут ни при чём (агент умер/отрезан, хороших/плохих отчётов нет вовсе).
fail_threshold = 3
recover_threshold = 2
report_freshness_min = 15
# Рипер неактивных (V7.9.6): нода, НЕПРЕРЫВНО нездоровая дольше стольких минут
# (живой агент, мёртвый прокси — heartbeat'ы идут, все проверки красные),
# удаляется из пула событием node_pruned; как прокси починится — сама
# пере-регистрируется. Ключ не задан = 60; явный 0 = рипер выключен.
# V7.9.7: после prune нода ещё и в карантине — повторная регистрация отклоняется
# (429 + Retry-After), серия карантинов нарастает 15м → 30м → 1ч → 2ч → 3ч
# и обнуляется первым реальным входом в очередь здоровых.
prune_unhealthy_min = 60

# Принудительная ротация мастерства (V7.9.3): максимум непрерывных минут ноды
# мастером одного домена — дальше домен уходит следующей здоровой ноде очереди
# (round-robin; отсчёт переживает рестарт регистратора). 0 = без лимита;
# ключ не задан = дефолт 30. Меняется из панели на лету.
[rotation]
master_ttl_minutes = 30

# Интервалы, раздаваемые нодам через GET /config (ноды применяют на лету).
# globalping — редко (rate-limit Globalping), metrics — локально и дёшево.
[node_defaults]
heartbeat_ms = 15000
globalping_ms = 300000
metrics_ms = 60000
sync_ms = 60000

[cloudflare]
api_token = "PASTE_YOUR_CLOUDFLARE_API_TOKEN"
zone_id = "PASTE_YOUR_ZONE_ID"
# V7: у КАЖДОГО домена свой мастер — A-запись указывает на свою ноду.
# Нод меньше, чем доменов → мастера дотягивают «сиротские» домены;
# домен, удалённый отсюда, из DNS не стирается (назначение просто сгорает).
domains = ["mtp1.example.com", "mtp2.example.com"]
dns_ttl = 60
proxied = false

[globalping]
api_base = "https://api.globalping.io/v1"
# API-токена нет сознательно: measurement'ы создают ноды анонимно со своих IP
# (per-IP квота 250 тестов/час), регистратор лишь скачивает результаты GET'ом,
# где почасовой квоты нет — токен там ничего не даёт. Старый ключ api_token
# просто игнорируется (V7.8.1).

[shared_proxy]
tls_domain = "www.example.com"

[shared_proxy.users]
hello = "0123456789abcdef0123456789abcdef"
