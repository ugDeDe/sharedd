[security]
# Общий секрет machine-to-machine API. Обязателен; один и тот же токен
# указывается как registry.token на каждой ноде. Генерируйте минимум 32 байта.
node_token = "PASTE_A_LONG_RANDOM_NODE_API_TOKEN"

[http]
# За Caddy-реверс-прокси достаточно loopback: ноды и панель ходят через https://домен.
addr = "127.0.0.1:8080"

[state]
file = "/var/lib/sharedd/registry_state.json"

# Встроенная веб-панель: /panel (HTML), /panel/api/overview, /panel/api/events.
# token защищает API панели и /status (Authorization: Bearer <token>).
# Обязательный Bearer token панели (минимум 16 символов).
[panel]
enabled = true
token = "REPLACE_WITH_A_RANDOM_PANEL_TOKEN"
events_max = 500
# Доверенный публичный origin для готовой команды подключения ноды.
public_url = "https://registry.example.com"

[healthcheck]
probe_interval_ms = 5000
probe_timeout_ms = 3000
selection_interval_ms = 3000
heartbeat_ttl_sec = 60
# Гистерезис здоровья ПО ПОДРЯД идущим проверкам (защёлки, не мгновенные флаги):
# fail_threshold — сколько подряд неудач гасит ноду (TCP-пробы каждые
# probe_interval_ms; metrics-отчёты — каждые metrics_ms).
# recover_threshold — сколько подряд удач возвращает её в строй.
# metrics-здоровье — тоже защёлка: одиночный сбойный отчёт мастерство
# НЕ роняет. Отдельно действует report_freshness_min — dead-man's switch: если
# ЖИВАЯ нода (любые признаки жизни) молчит дольше этого срока — она вне строя,
# серии тут ни при чём (агент умер/отрезан, хороших/плохих отчётов нет вовсе).
fail_threshold = 3
recover_threshold = 2
report_freshness_min = 15
# Verified Globalping result is valid for this many minutes. Must be strictly
# greater than node_defaults.globalping_ms.
globalping_validity_min = 15
# Рипер неактивных: нода, НЕПРЕРЫВНО нездоровая дольше стольких минут
# (живой агент, мёртвый прокси — heartbeat'ы идут, все проверки красные),
# удаляется из пула событием node_pruned; как прокси починится — сама
# пере-регистрируется. Ключ не задан = 60; явный 0 = рипер выключен.
# после prune нода ещё и в карантине — повторная регистрация отклоняется
# (429 + Retry-After), серия карантинов нарастает 15м → 30м → 1ч → 2ч → 3ч
# и обнуляется первым реальным входом в очередь здоровых.
prune_unhealthy_min = 60

# Принудительная ротация мастерства: максимум непрерывных минут ноды
# мастером одного домена — дальше домен уходит следующей здоровой ноде очереди
# (round-robin; отсчёт переживает рестарт регистратора). 0 = без лимита;
# ключ не задан = дефолт 30. Меняется из панели на лету.
[rotation]
master_ttl_minutes = 30

# Интервалы, раздаваемые нодам через GET /config (ноды применяют на лету).
# globalping — редко (rate-limit Globalping), metrics — локально и дёшево.
[node_defaults]
heartbeat_ms = 15000
globalping_ms = 300000
metrics_ms = 60000
sync_ms = 60000

[cloudflare]
api_token = "PASTE_YOUR_CLOUDFLARE_API_TOKEN"
zone_id = "PASTE_YOUR_ZONE_ID"
# у КАЖДОГО домена свой мастер — A-запись указывает на свою ноду.
# Нод меньше, чем доменов → мастера дотягивают «сиротские» домены;
# домен, удалённый отсюда, из DNS не стирается (назначение просто сгорает).
domains = ["mtp1.example.com", "mtp2.example.com"]
dns_ttl = 60
proxied = false

# СРМД — Система Распределения и Масштабирования Доменов.
# Следит за соотношением здоровой очереди нод и числа доменов и держит не
# больше max_nodes_per_domain нод на домен:
# - нод больше, чем доменов × лимит, и enabled=true — создаёт сиротские
# домены с инкрементом от base_domain (shared.ddproxy.xyz →
# shared1.ddproxy.xyz, shared2.…) и сама дописывает их в
# cloudflare.domains (персистится сюда же);
# - нод стало меньше — сворачивает лишние созданные домены в CNAME на
# оставшиеся, балансируя по последним известным числам активных клиентов
# (таблица «домен | активные пользователи» — в панели, вкладка «СРМД»);
# - ноды вернулись — сначала разворачивает свёрнутые, потом создаёт новые.
# Активные клиенты считаются только по общему секрету (пользователи из
# shared_proxy.users). По умолчанию создание доменов ВЫКЛЮЧЕНО: если нод
# слишком много, а enabled=false — панель даст алерт вверху экрана.
[srmd]
enabled = false
# пусто = первый домен из cloudflare.domains
base_domain = ""
max_nodes_per_domain = 5

[globalping]
api_base = "https://api.globalping.io/v1"
# API-токена нет сознательно: measurement'ы создают ноды анонимно со своих IP
# (per-IP квота 250 тестов/час), регистратор лишь скачивает результаты GET'ом,
# где почасовой квоты нет — токен там ничего не даёт. Старый ключ api_token
# просто игнорируется.

[shared_proxy]
tls_domain = "www.example.com"
# Общий порт всех прокси. Нода с другим локальным port не входит в пул;
# agent применяет ANTISCAN_MTPROTO только при точном совпадении.
port = 443

[shared_proxy.users]
hello = "0123456789abcdef0123456789abcdef"
