name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [registry, node]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go mod download
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -mod=readonly ./...

  golangci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [registry, node, tools/uigen]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # Блокирующий после локального прогона v2.13.1 (0 issues по обоим
      # прикладным модулям). Конфиг — дефолтный набор линтеров (errcheck,
      # govet, ineffassign, staticcheck, unused).
      # Линтер собираем из исходников тем же тулчейном, что и проект
      # (setup-go выше): готовый бинарник из релиза собран более старым Go,
      # чем go.mod (1.26.5), и падает с "language version mismatch"
      # (exit code 7) на всех модулях сразу.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - run: golangci-lint run --timeout 5m ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh
      # Уровень warning: скрипты чисты под ним локально (shellcheck 0.10.0).
      - run: |
          sudo apt-get update -qq && sudo apt-get install -yqq shellcheck
          shellcheck -S warning scripts/*.sh
      # Критичные функции конфиг-конвейера не должны расходиться между
      # интерактивным и web-установщиком ноды.
      - run: bash scripts/check_installer_parity.sh

  ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/uigen/go.mod
          cache-dependency-path: tools/uigen/go.sum
      - name: Проверка актуальности собранных страниц (ui/ -> registry/*.html)
        run: cd tools/uigen && go run . -root "$GITHUB_WORKSPACE" -check

  # Ручной релиз по тегу vX.Y.Z / VX.Y.Z (в репо исторически теги
  # с заглавной V). Обычно тег ставит сам job release-main (токен workflow
  # не триггерит повторный запуск, дубля нет); этот job нужен для тегов,
  # которые поставили руками. GitHub-hosted раннер собирает
  # статические бинарники и кладёт их в release. Сделанный (не draft)
  # релиз сразу же резолвится по releases/latest/download/... — на этом
  # построены web-установщики; make_latest гарантирует, что свежий тег
  # не останется невидимым.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: [go, golangci, scripts, ui-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: registry/go.mod
          cache-dependency-path: |
            registry/go.sum
            node/go.sum
      - name: Сборка (VERSION из тега, ведущие v/V отрезаются)
        run: VERSION="${GITHUB_REF_NAME#[vV]}" bash scripts/build_all.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/sharedd-registry
            dist/sharedd-node-agent
          make_latest: true

  # Ветка dev → движущийся prerelease-тег dev. Web-установщики качают его
  # через --channel=dev (releases/download/dev/...). make_latest:false —
  # dev никогда не перехватывает releases/latest (стабильный канал).
  # Версия сборки: <следующая>-dev.<sha7>, например 1.1.0-dev.abc1234.
  release-dev:
    if: github.ref == 'refs/heads/dev'
    needs: [go, golangci, scripts, ui-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: registry/go.mod
          cache-dependency-path: |
            registry/go.sum
            node/go.sum
      - name: Версия сборки
        id: ver
        run: echo "version=$(bash scripts/next_version.sh --dev)" >> "$GITHUB_OUTPUT"
      - name: Переместить dev-тег на текущий коммит
        run: |
          git tag -f dev
          # Явный refspec: короткое `dev` неоднозначно (есть ветка dev).
          git push -f origin refs/tags/dev:refs/tags/dev
      - name: Сборка dev
        run: VERSION="${{ steps.ver.outputs.version }}" bash scripts/build_all.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: dev ${{ steps.ver.outputs.version }}
          prerelease: true
          make_latest: false
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/sharedd-registry
            dist/sharedd-node-agent

  # Ветка main → автоматический stable-релиз: следующая версия считается по
  # коммитам с прошлого тега (scripts/next_version.sh: feat → minor,
  # type!: / BREAKING CHANGE → major, иначе patch), ставится тег vX.Y.Z и
  # создаётся release с make_latest — web-установщики (канал main) качают
  # releases/latest. Если у HEAD уже есть тег версии (ручной релиз) —
  # job ничего не делает.
  release-main:
    if: github.ref == 'refs/heads/main'
    needs: [go, golangci, scripts, ui-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Версия и тег
        id: ver
        run: |
          if git tag --points-at HEAD | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD уже помечен версией — релиз пропущен"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(bash scripts/next_version.sh)"
          git tag "v$version"
          # Явный refspec: не зависеть от одноимённых веток.
          git push origin "refs/tags/v$version:refs/tags/v$version"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: registry/go.mod
          cache-dependency-path: |
            registry/go.sum
            node/go.sum
      - if: steps.ver.outputs.skip != 'true'
        name: Сборка stable
        run: VERSION="${{ steps.ver.outputs.version }}" bash scripts/build_all.sh
      - if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/sharedd-registry
            dist/sharedd-node-agent
