  /* ui/components/glass.css */
  .glass {
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(
        180deg,
        var(--gl-a),
        var(--gl-b));
    border: 1px solid var(--gl-brd);
    box-shadow:
      inset 0 1px 0 var(--gl-hi),
      inset 0 -1px 0 var(--gl-lo),
      var(--sh-2);
    -webkit-backdrop-filter: blur(var(--gl-blur)) saturate(190%);
    backdrop-filter: blur(var(--gl-blur)) saturate(190%);
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    pointer-events: none;
    z-index: 2;
    background:
      linear-gradient(
        142deg,
        var(--gl-rim-a) 0%,
        transparent 34%,
        transparent 66%,
        var(--gl-rim-b) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
  }
  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(
        125deg,
        var(--gl-sheen) 0%,
        transparent 34%);
  }
  .glass > *:not(.glass-raw) {
    position: relative;
    z-index: 1;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass {
      background: var(--surf);
    }
  }

  .nav a {

  .topbar-right {

  @keyframes pulse {

  /* ui/components/card.css */

    border-radius: var(--r-lg);

<script>
(() => {
  // ui/lib/dom.ts
  var $ = (id) => document.getElementById(id);

  // ui/lib/theme.ts
  var KEY = "sharedd.theme";
  function initTheme() {
    const btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", () => {
      const root = document.documentElement;
      const next = root.dataset.theme === "light" ? "dark" : "light";
      root.dataset.theme = next;
      try {
        localStorage.setItem(KEY, next);
      } catch {
      }
      document.dispatchEvent(new CustomEvent("themechange"));
    });
  }

  // ui/pages/signin/main.ts
  async function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  }
  async function toErr(resp) {
    const data = await resp.json().catch(() => ({}));
    return { status: resp.status, code: data.error || "", message: data.message || "" };
  }
  function alertBox(text, info = false) {
    const el = $("auth-alert");
    el.textContent = text;
    el.classList.toggle("info", info);
    el.classList.toggle("bad", !info);
    el.setAttribute("role", info ? "status" : "alert");
    el.hidden = false;
  }
  function clearAlert() {
    $("auth-alert").hidden = true;
  }
  function showTab(which) {
    const isLogin = which === "login";
    $("panel-login").hidden = !isLogin;
    $("panel-register").hidden = isLogin;
    $("tab-login").classList.toggle("active", isLogin);
    $("tab-register").classList.toggle("active", !isLogin);
    $("tab-login").setAttribute("aria-selected", String(isLogin));
    $("tab-register").setAttribute("aria-selected", String(!isLogin));
    $("tab-login").tabIndex = isLogin ? 0 : -1;
    $("tab-register").tabIndex = isLogin ? -1 : 0;
    if (!isLogin) renderRegister();
  }
  var INVITE = null;
  var INVITE_DEAD = null;
