<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>sharedd · публичная статистика ноды</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%236366f1"/><stop offset="1" stop-color="%2322d3ee"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(%23g)"/><text x="32" y="44" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">DD</text></svg>'>
<style>
  :root {
    --bg: #05070d;
    --bg2: #0a0f1a;
    --card: rgba(15, 22, 36, .72);
    --border: rgba(148, 163, 184, .13);
    --border-strong: rgba(148, 163, 184, .26);
    --text: #e7ecf5;
    --muted: #8694aa;
    --green: #34d399;
    --red: #fb7185;
    --yellow: #fbbf24;
    --blue: #60a5fa;
    --purple: #c084fc;
    --accent1: #6366f1;
    --accent2: #22d3ee;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --radius: 16px;
    --shadow: 0 16px 44px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background:
      radial-gradient(920px 520px at 12% -12%, rgba(99,102,241,.15), transparent 62%),
      radial-gradient(820px 500px at 90% -14%, rgba(34,211,238,.09), transparent 62%),
      radial-gradient(760px 640px at 50% 118%, rgba(192,132,252,.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection { background: rgba(99,102,241,.42); color: #fff; }
  a { color: var(--blue); text-decoration: none; }

  /* ── каркас: сайдбар + контент ───────────────────────────────── */
  #app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
  .view[hidden] { display: none; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
  .brand-name { font-weight: 800; font-size: 15.5px; letter-spacing: .02em; }
  .brand-sub { color: var(--muted); font-size: 11.5px; }
  .nav { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.nav-item svg { flex: 0 0 auto; opacity: .85; }
  .nav-item:hover { color: var(--text); background: rgba(148,163,184,.07); }
  .nav-item.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(99,102,241,.22), rgba(34,211,238,.13));
    border-color: rgba(99,102,241,.42);
    box-shadow: 0 6px 18px rgba(99,102,241,.16), inset 3px 0 0 var(--accent1);
  }
.nav-item.active.main { min-width: 0; padding: 0 28px; display: flex; flex-direction: column; }
  .main main, .main footer, header.top { width: 100%; max-width: 1380px; margin-left: auto; margin-right: auto; }

  header.top {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 15px 0 16px; margin-bottom: 22px;
    background: rgba(5,7,13,.8);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  header.top h1 { font-size: 19px; font-weight: 700; letter-spacing: .01em; }
  header.top .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }

    .logo {
    width: 38px; height: 38px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; font-size: 13px; letter-spacing: 0.5px;
    box-shadow: 0 6px 20px rgba(99,102,241,.45), inset 0 1px 0 rgba(255,255,255,.3);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .pill {
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
    font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px;
    background: rgba(148,163,184,.06); backdrop-filter: blur(6px);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .pill.live .dot { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.78); } }
  button.ghost {
    background: rgba(148,163,184,.06); border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 6px 13px; cursor: pointer; font-size: 12.5px;
    transition: color .15s, border-color .15s, background .15s;
  }
  button.ghost:hover { color: var(--text); border-color: var(--border-strong); background: rgba(148,163,184,.1); }
  a.ghost {
    display: inline-flex; align-items: center;
    background: rgba(148,163,184,.06); border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 5px 12px; font-size: 12.5px;
    transition: color .15s, border-color .15s, background .15s;
  }
  a.ghost:hover { color: var(--text); border-color: var(--border-strong); background: rgba(148,163,184,.1); }

.back-link:hover { color: var(--text); }

  /* ── баннер тревоги ────────────────────────────────────────── */
.banner.show { display: block; animation: fade-in .25s ease; }
/* ── KPI-карточки: строго одинаковая высота, только числа ──── */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card {
    position: relative; overflow: hidden;
    background: linear-gradient(165deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px;
    box-shadow: 0 10px 26px rgba(0,0,0,.35);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    display: flex; flex-direction: column; min-height: 112px;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2)); opacity: .6;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 18px 36px rgba(0,0,0,.48); }
  .card .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
  .card .value { font-size: 27px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .card .extra { color: var(--muted); font-size: 12px; margin-top: auto; padding-top: 6px; }
  .value.good { color: var(--green); text-shadow: 0 0 18px rgba(52,211,153,.35); }
  .value.bad  { color: var(--red);   text-shadow: 0 0 18px rgba(251,113,133,.35); }
  .value.warn { color: var(--yellow); }
.card-top .label { margin-bottom: 0; }
.kpi-ico.kpi-ico.kpi-ico.kpi-ico.kpi-ico.kpi-ico/* ── секции ────────────────────────────────────────────────── */
  section.block {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .block-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.025);
  }
  .block-head h2 { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 10px; letter-spacing: .01em; }
  .block-head h2::before {
    content: ""; width: 4px; height: 17px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent1), var(--accent2));
    box-shadow: 0 0 10px rgba(99,102,241,.5);
  }
  .block-head .hint { color: var(--muted); font-size: 12px; }

  /* ── таблица нод ───────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid rgba(148,163,184,.09); white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; background: rgba(255,255,255,.015); }
  tbody tr { transition: background .14s ease; }
  tbody tr:hover { background: rgba(148,163,184,.05); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.rowlink { cursor: pointer; }
  tbody tr.master {
    background: linear-gradient(90deg, rgba(251,191,36,.09), transparent 55%);
    box-shadow: inset 3px 0 0 rgba(251,191,36,.55);
  }
  tbody tr.master:hover { background: linear-gradient(90deg, rgba(251,191,36,.13), rgba(148,163,184,.04) 55%); }
  td.idcell { font-family: var(--mono); font-size: 12.5px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  td .ip { font-family: var(--mono); font-size: 12.5px; color: #b7c3d9; }
  .tbl-wrap { overflow-x: auto; }

  /* ── бейджи ────────────────────────────────────────────────── */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
    padding: 3px 10px; font-size: 11px; font-weight: 700; letter-spacing: .03em;
    border: 1px solid transparent;
  }
  .badge.ok  { color: var(--green);  background: rgba(52,211,153,.1);  border-color: rgba(52,211,153,.3); }
  .badge.no  { color: var(--red);    background: rgba(251,113,133,.1); border-color: rgba(251,113,133,.32); }
  .badge.unk { color: var(--muted);  background: rgba(134,148,170,.1); border-color: rgba(134,148,170,.24); }
  .badge.master {
    color: #fcd34d; background: rgba(251,191,36,.13); border-color: rgba(251,191,36,.4);
    text-shadow: 0 0 14px rgba(251,191,36,.4);
  }
  .badge.queue { color: var(--blue); background: rgba(96,165,250,.1); border-color: rgba(96,165,250,.3); font-family: var(--mono); }
  /* бейджи типа ноды (classic — обычный muted, без класса) */
  .badge.t-purple {
    color: var(--purple); background: rgba(192,132,252,.12); border-color: rgba(192,132,252,.38);
    text-shadow: 0 0 14px rgba(192,132,252,.35);
  }
  .badge.t-cyan {
    color: var(--accent2); background: rgba(34,211,238,.1); border-color: rgba(34,211,238,.36);
    text-shadow: 0 0 14px rgba(34,211,238,.32);
  }

  .avail { display: flex; align-items: center; gap: 8px; }
  .avail .bar {
    width: 74px; height: 7px; border-radius: 999px;
    background: rgba(148,163,184,.14); overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.55);
  }
  .avail .bar > div { height: 100%; border-radius: 999px; transition: width .4s ease; }
  .avail .mono { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .reason { color: var(--yellow); font-size: 12px; white-space: normal; min-width: 160px; }

  /* ── рельса мастеров (строки доменов) ─────────────────────── */
.mrow:hover { background: rgba(148,163,184,.05); }
  .mrow:last-child { border-bottom: none; }
.mdot.alive { background: var(--green);  box-shadow: 0 0 9px rgba(52,211,153,.8); }
  .mdot.warn  { background: var(--yellow); box-shadow: 0 0 9px rgba(251,191,36,.8); }
  .mdot.dead  { background: var(--red);    box-shadow: 0 0 9px rgba(251,113,133,.8); }
.mrow .badge { flex: 0 0 auto; }

  /* ── фильтры журнала ───────────────────────────────────────── */
.filters button {
    background: rgba(148,163,184,.06); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 5px 14px; font-size: 12.5px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s, box-shadow .15s;
  }
  .filters button:hover { color: var(--text); border-color: var(--border-strong); }
  .filters button.active {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 5px 16px rgba(99,102,241,.4);
  }

  /* ── журнал событий ────────────────────────────────────────── */
  .events { list-style: none; padding: 10px 14px 14px; max-height: 460px; overflow-y: auto; }
  .events li {
    display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 9px;
    border-bottom: 1px solid rgba(148,163,184,.07); font-size: 13px;
    transition: background .13s ease;
  }
  .events li:hover { background: rgba(148,163,184,.05); }
  .events li:last-child { border-bottom: none; }
  .ev-time { color: var(--muted); font-family: var(--mono); font-size: 11.5px; flex: 0 0 178px; font-variant-numeric: tabular-nums; }
  .ev-type {
    flex: 0 0 auto; border-radius: 999px; padding: 2px 9px; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; border: 1px solid transparent;
  }
  .ev-good  { color: var(--green);  background: rgba(52,211,153,.1);  border-color: rgba(52,211,153,.26); }
  .ev-bad   { color: var(--red);    background: rgba(251,113,133,.1); border-color: rgba(251,113,133,.28); }
  .ev-warn  { color: var(--yellow); background: rgba(251,191,36,.1);  border-color: rgba(251,191,36,.26); }
  .ev-info  { color: var(--blue);   background: rgba(96,165,250,.1);  border-color: rgba(96,165,250,.26); }
  .ev-neutral { color: var(--muted); background: rgba(134,148,170,.1); border-color: rgba(134,148,170,.22); }
  .ev-node { font-family: var(--mono); font-size: 12px; color: var(--purple); }
  .ev-detail { color: var(--muted); font-size: 12.5px; word-break: break-word; }
  .events::-webkit-scrollbar,
  .masters-list::-webkit-scrollbar { width: 9px; }
  .events::-webkit-scrollbar-thumb,
  .masters-list::-webkit-scrollbar-thumb {
    background: rgba(148,163,184,.22); border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  .events::-webkit-scrollbar-thumb:hover,
  .masters-list::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.34); background-clip: padding-box; }

  .empty { color: var(--muted); padding: 24px; text-align: center; font-size: 13px; }

  /* ── нода детально ──────────────────────────────────────────── */
  .card.nd-head {
    flex-direction: row; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 18px 20px; margin-bottom: 18px; min-height: 0;
  }
  .card.nd-head:hover { transform: none; }
  .nd-id { font-family: var(--mono); font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .nd-ip { font-family: var(--mono); color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .nd-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-left: auto; }
  .nd-reason { flex: 0 0 100%; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .gp-grid {
    display: grid; grid-template-columns: minmax(230px, .8fr) minmax(0, 1.7fr);
    gap: 20px; padding: 16px 18px 18px; align-items: start;
  }
  .gp-side .extra { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .gp-side .extra b { color: var(--text); font-family: var(--mono); }
  .gp-big { font-size: 38px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.1; margin-bottom: 8px; }
  .gp-big.good { color: var(--green); text-shadow: 0 0 22px rgba(52,211,153,.4); }
  .gp-big.bad  { color: var(--red);   text-shadow: 0 0 22px rgba(251,113,133,.4); }
  .chart-body { padding: 12px 18px 18px; }
  .chart-cap {
    color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
    margin: 14px 0 8px; display: flex; gap: 8px; align-items: baseline;
  }
  .chart-cap:first-child { margin-top: 2px; }
  .chart-cap .hint { text-transform: none; letter-spacing: 0; }
  .ticks { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
  .tick { width: 7px; height: 16px; border-radius: 2.5px; background: rgba(52,211,153,.85); }
  .tick.fail { background: rgba(251,113,133,.9); }
  .bars { display: flex; align-items: flex-end; gap: 3px; min-height: 56px; }
  .bars:empty { display: none; }
  .gbar {
    flex: 1 1 0; min-width: 4px; max-width: 16px; border-radius: 3px 3px 1px 1px;
    background: linear-gradient(180deg, rgba(52,211,153,.95), rgba(52,211,153,.4));
    transition: height .3s ease;
  }
  .gbar.mid  { background: linear-gradient(180deg, rgba(251,191,36,.95), rgba(251,191,36,.4)); }
  .gbar.fail { background: linear-gradient(180deg, rgba(251,113,133,.95), rgba(251,113,133,.4)); }
  .spark { width: 100%; height: 56px; display: block; cursor: crosshair; }

  /* ── hover-подсказка спарклайна клиентов на странице ноды ──────── */
  .sparkwrap { position: relative; }
  .spark-guide {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: rgba(231,236,245,.38); pointer-events: none;
    opacity: 0; transition: opacity .1s ease;
  }
  .spark-dot {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent2); box-shadow: 0 0 8px rgba(34,211,238,.9);
    transform: translate(-50%, -50%); pointer-events: none;
    opacity: 0; transition: opacity .1s ease;
  }
  .spark-tip {
    position: absolute; top: -6px; transform: translate(-50%, -100%);
    background: rgba(7,12,21,.95); border: 1px solid var(--border-strong);
    border-radius: 9px; padding: 4px 10px; font-family: var(--mono);
    font-size: 11px; color: var(--text); white-space: nowrap;
    pointer-events: none; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.45);
    opacity: 0; transition: opacity .1s ease;
  }
  .spark-tip b { color: var(--accent2); }
  .sparkwrap.hover .spark-guide,
  .sparkwrap.hover .spark-dot,
  .sparkwrap.hover .spark-tip { opacity: 1; }

  /* ── вход ──────────────────────────────────────────────────── */
  #login-overlay {
    position: fixed; inset: 0; background: rgba(3,5,10,.8);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #login-overlay.show { display: flex; animation: fade-in .2s ease; }
.login-box::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
  }
.login-box h2 { font-size: 16.5px; font-weight: 700; margin-bottom: 6px; }
  .login-box h2::before { content: none; }
  .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .login-box input {
    width: 100%; background: rgba(4,7,14,.75); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 13px; font-size: 13.5px; margin-bottom: 12px; font-family: var(--mono);
    transition: border-color .15s, box-shadow .15s;
  }
  .login-box input:focus { outline: none; border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(99,102,241,.22); }
  .login-box button {
    width: 100%; border: none; border-radius: 10px; padding: 10px; cursor: pointer;
    font-size: 13.5px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 6px 18px rgba(99,102,241,.4);
    transition: filter .15s, transform .15s;
  }
  .login-box button:hover { filter: brightness(1.12); transform: translateY(-1px); }
.login-err.show { display: block; }

  /* ── настройки ─────────────────────────────────────────────── */
fieldsetfieldset.cfg legend {
    color: #aeb9cd; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
    font-weight: 700; padding: 0 8px;
  }
  fieldset.cfg label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  .cfg input[type=text], .cfg input[type=password], .cfg input[type=number], .cfg textarea {
    width: 100%; background: rgba(4,7,14,.7); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 8px 11px; font-size: 12.5px; font-family: var(--mono);
    transition: border-color .15s, box-shadow .15s;
  }
  .cfg input:focus, .cfg textarea:focus { outline: none; border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
  .cfg input[type=checkbox] { accent-color: var(--accent1); width: 15px; height: 15px; }
  .cfg textarea { resize: vertical; min-height: 64px; }
  .cfg .row { display: flex; gap: 8px; align-items: center; margin-top: 11px; flex-wrap: wrap; }
  .cfg .row label { margin: 0; }
  button.act {
    border: none; border-radius: 9px; padding: 7px 15px; cursor: pointer;
    font-size: 12.5px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 4px 14px rgba(99,102,241,.32);
    transition: filter .15s, transform .15s, box-shadow .15s;
  }
  button.act:hover { filter: brightness(1.14); transform: translateY(-1px); }
  button.act:active { transform: translateY(0); }
  button.act.secondary {
    background: rgba(148,163,184,.08); color: var(--text);
    border: 1px solid var(--border-strong); box-shadow: none;
  }
  button.act.secondary:hover { background: rgba(148,163,184,.13); filter: none; }
  button.act.danger {
    background: transparent; color: var(--red); border: 1px solid rgba(251,113,133,.45); box-shadow: none;
  }
  button.act.danger:hover { background: rgba(251,113,133,.12); filter: none; }
  .cfg .note { color: var(--muted); font-size: 11.5px; margin-top: 10px; line-height: 1.5; }
  #users-tbl { width: 100%; font-size: 12.5px; }
  #users-tbl td { padding: 4px 6px; border-bottom: 1px solid rgba(148,163,184,.08); white-space: normal; }
  #users-tbl input { width: 100%; }
/* ── тост ──────────────────────────────────────────────────── */
  #toast {
    position: fixed; top: 20px; right: 20px; z-index: 60; max-width: 460px;
    border-radius: 14px; padding: 12px 17px; font-size: 13px; display: none;
    border: 1px solid rgba(52,211,153,.45); border-left-width: 3px;
    background: rgba(7,12,21,.93); color: var(--green);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
  }
  #toast.err { border-color: rgba(251,113,133,.5); border-left-width: 3px; color: #fecdd3; }
  #toast.show { display: block; animation: toast-in .28s cubic-bezier(.2,1.1,.4,1); }

  footer {
    color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px;
    letter-spacing: .02em; opacity: .85; padding-bottom: 12px;
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(.95) translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

  /* сайдбар сворачивается в верхнюю полосу */
  @media (max-width: 1080px) {
    #app { grid-template-columns: 1fr; }
.brand-sub { display: none; }
    .nav { flex-direction: row; margin-top: 0; overflow-x: auto; flex: 1 1 auto; gap: 5px; }
.nav-item.active { box-shadow: 0 4px 14px rgba(99,102,241,.16), inset 0 -3px 0 var(--accent1); }
.gp-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .main { padding: 0 14px; }
    .ev-time { flex: 0 0 118px; }
    .card .value { font-size: 23px; }
    .brand { display: none; }
  }

  /* ── публичный одноколоночный каркас ──────────────────────────── */
  #app { display: block; }
  header.top { max-width: 1180px; margin: 0 auto 22px; padding-left: 28px; padding-right: 28px; }
  main.pub { max-width: 1180px; margin: 0 auto; padding: 0 28px 42px; display: block; }
  footer.pub-foot { max-width: 1180px; margin: 0 auto; padding: 0 28px 26px; color: var(--muted); font-size: 12px; }
  .pub-note {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: rgba(148,163,184,.05); color: var(--muted);
    font-size: 12.5px; padding: 10px 14px; margin-bottom: 18px;
  }
  .pub-note b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" style="padding:0">
      <div class="logo">DD</div>
      <div>
        <div class="brand-name">sharedd</div>
        <div class="brand-sub">регистратор прокси-пула</div>
      </div>
    </div>
    <div style="min-width:0">
      <h1 id="view-title">Публичная статистика</h1>
      <div class="sub" id="view-sub">открытая страница · IP частично скрыт</div>
    </div>
    <div class="top-right">
      <a class="back-link" href="/dashboard">Дашборд блокировок →</a>
      <span class="pill live"><span class="dot"></span><span id="upd">обновление…</span></span>
    </div>
  </header>
  <main class="pub" id="root"><div class="empty">загрузка…</div></main>
  <footer class="pub-foot">sharedd · публичная статистика нод пула · обновление каждые 15 с</footer>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
        m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (d > 0) return `${d}д ${h}ч`;
  if (h > 0) return `${h}ч ${m}м`;
  if (m > 0) return `${m}м ${s}с`;
  return `${s}с`;
}
function fmtAgo(iso) {
  if (!iso) return "—";
  const sec = (Date.now() - new Date(iso).getTime()) / 1000;
  if (sec < 10) return "только что";
  if (sec < 3600) return `${Math.floor(sec / 60)} мин назад`;
  if (sec < 86400) return `${Math.floor(sec / 3600)} ч назад`;
  return `${Math.floor(sec / 86400)} дн назад`;
}
function fmtClock(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"});
}
function chip(flag, okText, noText) {
  if (flag === null || flag === undefined) return `<span class="badge unk">—</span>`;
  return flag ? `<span class="badge ok">${okText || "ok"}</span>` : `<span class="badge no">${noText || "fail"}</span>`;
}
function availColor(p) { return p >= 99 ? "var(--green)" : p >= 95 ? "var(--yellow)" : "var(--red)"; }

const NODE_TYPE_META = {
  classic:  {label: "Classic",  cls: "unk",      title: "классический telemt"},
  mtproxyl: {label: "MTProxyL", cls: "t-purple", title: "форк MTProxyL (/opt/mtproxyl/)"},
  meko:     {label: "MEKO",     cls: "t-cyan",   title: "фикс MEKO (/opt/mtpr-simple/)"},
};
function nodeTypeBadge(t) {
  const m = NODE_TYPE_META[t];
  if (!m) return "";
  return `<span class="badge ${m.cls}" title="${esc(m.title)}">${esc(m.label)}</span>`;
}

const EV_META = {
  registry_started:      {label: "Запуск регистратора",  cls: "ev-neutral"},
  config_changed:        {label: "Конфиг изменён",       cls: "ev-info"},
  node_registered:       {label: "Регистрация ноды",     cls: "ev-info"},
  node_replaced:         {label: "Нода вытеснена",       cls: "ev-warn"},
  node_expired:          {label: "Нода отвалилась",      cls: "ev-warn"},
  node_pruned:           {label: "Удалена (неактивна)",  cls: "ev-warn"},
  tcp_down:              {label: "TCP недоступен",       cls: "ev-bad"},
  tcp_up:                {label: "TCP восстановлен",     cls: "ev-good"},
  metrics_down:          {label: "Метрики в отказе",     cls: "ev-bad"},
  metrics_up:            {label: "Метрики восстановлены", cls: "ev-good"},
  globalping_blocked:    {label: "Блокировка (GP)",      cls: "ev-bad"},
  globalping_recovered:  {label: "GP восстановлен",      cls: "ev-good"},
  queue_joined:          {label: "В очереди мастеров",   cls: "ev-info"},
  ip_blocked:            {label: "IP заблокирован (смена в карантине)", cls: "ev-bad"},
  queue_left:            {label: "Вышла из очереди",     cls: "ev-warn"},
  master_elected:        {label: "Мастер избран",        cls: "ev-good"},
  master_lost:           {label: "Мастер потерян",       cls: "ev-bad"},
  dns_updated:           {label: "DNS обновлён",         cls: "ev-info"},
  dns_error:             {label: "Ошибка DNS",           cls: "ev-bad"},
  dns_deleted:           {label: "DNS запись удалена",   cls: "ev-warn"},
};

async function pubApi(path) {
  const resp = await fetch(path, {cache: "no-store"});
  if (!resp.ok) { const e = new Error("HTTP " + resp.status); e.status = resp.status; throw e; }
  return resp.json();
}

/* ---------------- список нод (/statistics) ---------------- */

function listRowHTML(n) {
  const avail = n.availability_pct ?? 0;
  const role = n.is_master
    ? `<span class="badge master" title="${esc((n.master_domains || []).join(", "))}">★ МАСТЕР</span>`
    : (n.queue_position > 0 ? `<span class="badge queue">#${n.queue_position}</span>` : `<span class="badge unk">вне очереди</span>`);
  // когда мастера переключит таймер (принудительная ротация)
  const ttlRem = n.is_master && n.master_ttl_remaining_sec != null
    ? `<div class="muted" style="font-size:11px;margin-top:3px" title="принудительная ротация мастерства по master_ttl_minutes">⏱ ${
        n.master_ttl_remaining_sec <= 0 ? "переключение сейчас" : "переключение через " + fmtDur(n.master_ttl_remaining_sec)}</div>`
    : "";
  const clients = n.clients_unique_ips ?? null;
  return `<tr class="rowlink" data-id="${esc(n.node_id)}" title="открыть публичную статистику ноды">
    <td class="idcell mono" title="${esc(n.node_id)}">${esc(n.node_id)}</td>
    <td><span class="ip mono">${esc(n.ip)}${n.port ? ":" + n.port : ""}</span></td>
    <td>${role}${ttlRem}</td>
    <td>${chip(n.healthy)}</td>
    <td>${chip(n.globalping_ok)}</td>
    <td><span title="защёлка metrics-здоровья: в отказ только после серии подряд плохих отчётов">${chip(n.metrics_healthy, "metrics ok", "metrics fail")}</span></td>
    <td><div class="avail"><div class="bar"><div style="width:${avail}%;background:${availColor(avail)}"></div></div><span class="mono">${avail.toFixed(1)}%</span></div></td>
    <td class="mono">${clients === null ? "—" : clients}</td>
    <td class="mono">${n.report_age_sec < 0 ? "—" : fmtDur(n.report_age_sec) + " назад"}</td>
    <td>${nodeTypeBadge(n.node_type)}</td>
  </tr>`;
}

async function renderListView() {
  const d = await pubApi("/statistics/api/list");
  $("view-title").textContent = "Публичная статистика пула";
  const rows = (d.nodes || []).map(listRowHTML).join("");
  $("root").innerHTML = `
    <div class="pub-note">Открытая сводка пула: <b>IP-адреса замаскированы</b>. Клик по строке — подробная страница ноды.</div>
    <section class="block">
      <div class="block-head"><h2>Ноды пула</h2><span class="hint">${(d.nodes || []).length} шт</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Нода</th><th>IP (маска)</th><th>Роль</th><th>TCP</th><th>GP</th><th>Metrics</th><th>Доступность</th><th>Клиенты</th><th>Отчёт</th><th>Тип</th></tr></thead>
        <tbody id="pub-nodes-body">${rows || `<tr><td colspan="10" class="empty">пул пуст</td></tr>`}</tbody>
      </table></div>
    </section>`;
  const body = $("pub-nodes-body");
  if (body) body.addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (tr) location.href = "/statistics/" + encodeURIComponent(tr.dataset.id);
  });
}

/* ---------------- страница ноды (/statistics/<id>) ---------------- */

function clientsSparkInteractive(pts) {
  if (pts.length < 2) {
    return `<div class="muted" style="padding:6px 0">пока мало данных</div>`;
  }
  const w = 600, hgt = 56, max = Math.max(...pts.map((p) => p.v), 1);
  const step = w / (pts.length - 1);
  const xy = pts.map((p, i) => [i * step, hgt - 5 - (p.v / max) * (hgt - 12)]);
  const s = xy.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  return `<div class="sparkwrap" id="clients-sparkwrap">
    <svg class="spark" id="clients-spark" viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none">
      <polygon points="0,${hgt} ${s} ${w},${hgt}" fill="rgba(99,102,241,.13)"/>
      <polyline points="${s}" fill="none" stroke="var(--accent2)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="spark-guide" id="clients-guide"></div>
    <div class="spark-dot" id="clients-dot"></div>
    <div class="spark-tip" id="clients-tip"></div>
  </div>`;
}

function attachSparkHover(pts) {
  const wrap = $("clients-sparkwrap");
  const svg = $("clients-spark");
  if (!wrap || !svg || pts.length < 2 || !svg.getBoundingClientRect) return;
  const guide = $("clients-guide"), dot = $("clients-dot"), tip = $("clients-tip");
  const hgt = 56, max = Math.max(...pts.map((p) => p.v), 1);
  wrap.addEventListener("mousemove", (e) => {
    const rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    let frac = (e.clientX - rect.left) / rect.width;
    frac = Math.min(1, Math.max(0, frac));
    const i = Math.min(pts.length - 1, Math.round(frac * (pts.length - 1)));
    const xFraction = i / (pts.length - 1);
    const xPx = xFraction * rect.width;
    const yUnit = hgt - 5 - (pts[i].v / max) * (hgt - 12);
    const yPx = (yUnit / hgt) * rect.height;
    guide.style.left = xPx.toFixed(1) + "px";
    dot.style.left = xPx.toFixed(1) + "px";
    dot.style.top = yPx.toFixed(1) + "px";
    tip.textContent = `${fmtClock(pts[i].at)} · ${pts[i].v} подкл.`;
    tip.style.left = Math.min(Math.max(xPx, 62), rect.width - 62).toFixed(1) + "px";
    wrap.classList.add("hover");
  });
  wrap.addEventListener("mouseleave", () => wrap.classList.remove("hover"));
}

function renderPubEvents(list) {
  if (!list || list.length === 0) return `<li class="empty">Событий пока нет</li>`;
  return list.map((ev) => {
    const m = EV_META[ev.type] || {label: ev.type, cls: "ev-neutral"};
    return `<li>
      <span class="ev-time" title="${esc(ev.at)}">${fmtClock(ev.at)}</span>
      <span class="ev-type ${m.cls}">${m.label}</span>
      ${ev.domain ? `<span class="ev-node" style="color:var(--purple)">${esc(ev.domain)}</span>` : ""}
      ${ev.detail ? `<span class="ev-detail">${esc(ev.detail)}</span>` : ""}
    </li>`;
  }).join("");
}

async function renderNodeView(id) {
  const d = await pubApi("/statistics/api/node?id=" + encodeURIComponent(id));
  const n = d.node || {};
  $("view-title").textContent = "Нода · " + (n.node_id || id);
  const mdoms = n.master_domains || [];
  const clients = n.clients_unique_ips ?? null;
  const roleChip = n.is_master
    ? `<span class="badge master" title="${esc(mdoms.join(", "))}">★ МАСТЕР${mdoms.length > 1 ? " ×" + mdoms.length : ""}</span>`
    : (n.queue_position > 0
        ? `<span class="badge queue" title="fully healthy — ждёт назначения домена">очередь #${n.queue_position}</span>`
        : `<span class="badge unk">вне очереди</span>`);
  const hcFail = (d.hc && d.hc.fail_threshold) || "?";
  const mStreak = n.metrics_fail_streak || 0;
  const mChip = chip(n.metrics_healthy, "metrics ok", "metrics fail")
    + (mStreak > 0
      ? ` <span class="muted" style="font-size:11px">серия ${mStreak}/${hcFail}</span>`
      : "");
  const ttlRem = n.is_master && n.master_ttl_remaining_sec != null
    ? `<span class="muted" title="принудительная ротация мастерства по master_ttl_minutes"> · ⏱ ${
        n.master_ttl_remaining_sec <= 0 ? "переключение сейчас" : "переключение через " + fmtDur(n.master_ttl_remaining_sec)}</span>`
    : "";
  const chips = [
    chip(n.healthy, "TCP ok", "TCP fail"),
    chip(n.globalping_ok, "GP ok", "GP fail"),
    mChip,
    roleChip,
    nodeTypeBadge(n.node_type),
  ].join(" ") + ttlRem;
  const reason = n.unhealthy_reason
    ? `<div class="nd-reason"><span class="reason">${esc(n.unhealthy_reason)}</span></div>` : "";

  const statDefs = [
    {l: "Доступность", v: `${(n.availability_pct ?? 0).toFixed(1)}%`, e: `отчётов ok: ${n.reports_ok ?? 0}/${n.reports_total ?? 0}`,
     cls: (n.availability_pct ?? 0) >= 99 ? "good" : (n.availability_pct ?? 0) >= 95 ? "warn" : "bad",
     t: "ReportsOK/ReportsTotal × 100% за всё время жизни node_id"},
    {l: "GP верификации", v: `${(n.gp_verified_pct ?? 0).toFixed(1)}%`, e: `верификаций всего: ${n.gp_checks_total ?? 0}`,
     cls: (n.gp_verified_pct ?? 0) >= 99 ? "good" : (n.gp_verified_pct ?? 0) >= 90 ? "warn" : "bad",
     t: "Доля успешных НЕЗАВИСИМЫХ верификаций Globalping"},
    {l: "Клиенты", v: clients === null ? "—" : String(clients),
     e: clients === null ? "нет данных" : "уникальные активные IP",
     t: "telemt_user_unique_ips_current (агрегат по пользователям)"},
    {l: "Мастерство", v: (n.master_stints ?? 0) > 0 ? fmtDur(n.master_time_sec) : "—", e: `stint'ов: ${n.master_stints ?? 0}`,
     t: "Суммарное время в роли мастера домена"},
    {l: "Heartbeat", v: `${fmtDur(n.heartbeat_age_sec)} назад`, e: `всего: ${n.heartbeats_total ?? 0}`, cls: n.heartbeat_age_sec > 45 ? "bad" : ""},
    {l: "Отчёт", v: n.report_age_sec < 0 ? "—" : `${fmtDur(n.report_age_sec)} назад`, e: "metrics / globalping"},
  ];
  const stats = statDefs.map((s) => `<div class="card"${s.t ? ` title="${esc(s.t)}"` : ""}>
      <div class="label">${s.l}</div>
      <div class="value ${s.cls || ""}" style="font-size:20px">${s.v}</div>
      <div class="extra">${esc(s.e)}</div></div>`).join("");

  const gp = d.gp_last || null;
  const gpHist = d.gp_hist || [];
  let gpSide;
  if (gp) {
    gpSide = `<div class="gp-side">
      <div class="gp-big ${gp.ok ? "good" : "bad"}">${Math.round((gp.ratio || 0) * 100)}%</div>
      <div>${chip(gp.ok, "верификация пройдена", "верификация провалена")}</div>
      <div class="extra">проб успешно: <b>${gp.probes_ok}/${gp.probes_total}</b></div>
      <div class="extra">проверено: ${esc(fmtAgo(gp.at))}</div>
    </div>`;
  } else {
    gpSide = `<div class="gp-side">
      <div class="empty" style="padding:12px 0">Детали по площадкам появятся после ближайшей верификации</div>
      <div class="extra">текущий статус: ${chip(n.globalping_ok)}${n.gp_checks_total ? ` · ratio последней: ${(n.globalping_ratio * 100).toFixed(0)}%` : ""}</div>
    </div>`;
  }
  const probesTbl = gp && (gp.probes || []).length
    ? `<div class="tbl-wrap"><table>
        <thead><tr><th>Площадка</th><th>Сеть</th><th>Статус пробы</th><th>HTTP</th><th>Итог</th></tr></thead>
        <tbody>${gp.probes.map((p) => `<tr>
          <td class="mono">${esc(p.country || "?")}${p.city ? " · " + esc(p.city) : ""}</td>
          <td class="mono muted">${esc(p.network || "—")}${p.asn ? " (AS" + p.asn + ")" : ""}</td>
          <td class="mono">${esc(p.status || "—")}</td>
          <td class="mono">${p.http_code || "—"}</td>
          <td>${chip(p.ok)}</td>
        </tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">строк проб нет${gp ? " (measurement ещё выполнялся, когда его скачали)" : ""}</div>`;

  const tcpHist = d.tcp_hist || [];
  const tcpTicks = tcpHist.slice(-96).map((p) =>
    `<div class="tick ${p.ok ? "" : "fail"}" title="${esc(fmtClock(p.at))} — ${p.ok ? "ok" : "FAIL"}"></div>`).join("");
  const gpBars = gpHist.map((p) => {
    const h = 6 + Math.round((p.ratio || 0) * 50);
    const cls = p.ok ? "" : (p.ratio >= 0.35 ? "mid" : "fail");
    return `<div class="gbar ${cls}" style="height:${h}px" title="${esc(fmtClock(p.at))} — ratio ${(p.ratio * 100).toFixed(0)}% (${p.probes_ok}/${p.probes_total})"></div>`;
  }).join("");
  const repHist = d.report_hist || [];
  const repTicks = repHist.slice(-96).map((p) =>
    `<div class="tick ${p.metrics_ok ? "" : "fail"}" title="${esc(fmtClock(p.at))} — metrics ${p.metrics_ok ? "ok" : "FAIL"}"></div>`).join("");
  const clientPts = repHist.filter((p) => p.clients >= 0).map((p) => ({at: p.at, v: p.clients}));

  $("root").innerHTML = `
    <div class="pub-note"><a href="/statistics">← все ноды пула</a> · IP-адрес замаскирован.</div>
    <div class="card nd-head">
      <div>
        <div class="nd-id">${esc(n.node_id)}</div>
        <div class="nd-ip">${esc(n.ip)}${n.port ? ":" + n.port : ""} · зарегистрирована ${esc(fmtAgo(n.registered_at))}</div>
      </div>
      <div class="nd-chips">${chips}</div>
      ${reason}
    </div>
    <div class="stat-grid">${stats}</div>
    <section class="block">
      <div class="block-head">
        <h2>Globalping — независимая верификация</h2>
      </div>
      <div class="gp-grid">${gpSide}${probesTbl}</div>
    </section>
    <section class="block">
      <div class="block-head">
        <h2>История проверок</h2>
      </div>
      <div class="chart-body">
        <div class="chart-cap">Globalping — ratio по верификациям <span class="hint">всего ${gpHist.length}</span></div>
        <div class="bars">${gpBars || '<span class="muted">пока нет верификаций</span>'}</div>
        <div class="chart-cap">TCP-probe регистратора <span class="hint">последние ${Math.min(tcpHist.length, 96)}</span></div>
        <div class="ticks">${tcpTicks || '<span class="muted">пока нет данных</span>'}</div>
        <div class="chart-cap">Отчёты metrics <span class="hint">последние ${Math.min(repHist.length, 96)}</span></div>
        <div class="ticks">${repTicks || '<span class="muted">пока нет данных</span>'}</div>
        <div class="chart-cap">Активные клиенты (unique IP)</div>
        ${clientsSparkInteractive(clientPts)}
      </div>
    </section>
    <section class="block">
      <div class="block-head">
        <h2>События ноды</h2>
        <span class="hint">последние 100</span>
      </div>
      <ul class="events" style="max-height:none">${renderPubEvents(d.events || [])}</ul>
    </section>`;
  attachSparkHover(clientPts);
}

/* ---------------- каркас ---------------- */

const pathId = decodeURIComponent(location.pathname.replace(/^\/statistics\/?/, "").replace(/\/+$/, ""));

async function refreshCurrent() {
  const y = window.scrollY;
  try {
    if (pathId) { await renderNodeView(pathId); } else { await renderListView(); }
    $("upd").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU");
  } catch (e) {
    if (e && e.status === 404 && pathId) {
      $("root").innerHTML = `<div class="empty">нода <b>${esc(pathId)}</b> не найдена в пуле (или уже удалена).<br><br><a href="/statistics">← к списку нод</a></div>`;
    } else {
      $("root").innerHTML = `<div class="empty">не удалось загрузить данные: ${esc(e.message || e)}</div>`;
    }
    $("upd").textContent = "ошибка обновления";
  }
  window.scrollTo(0, y);
}

refreshCurrent();
setInterval(refreshCurrent, 15000);
</script>
