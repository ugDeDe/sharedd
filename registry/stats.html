  /* ui/components/glass.css */
  .glass {
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(
        180deg,
        var(--gl-a),
        var(--gl-b));
    border: 1px solid var(--gl-brd);
    box-shadow:
      inset 0 1px 0 var(--gl-hi),
      inset 0 -1px 0 var(--gl-lo),
      var(--sh-2);
    -webkit-backdrop-filter: blur(var(--gl-blur)) saturate(190%);
    backdrop-filter: blur(var(--gl-blur)) saturate(190%);
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    pointer-events: none;
    z-index: 2;
    background:
      linear-gradient(
        142deg,
        var(--gl-rim-a) 0%,
        transparent 34%,
        transparent 66%,
        var(--gl-rim-b) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
  }
  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(
        125deg,
        var(--gl-sheen) 0%,
        transparent 34%);
  }
  .glass > *:not(.glass-raw) {
    position: relative;
    z-index: 1;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass {
      background: var(--surf);
    }
  }

        $("root").innerHTML = `<div class="card"><div class="empty-state">${icon(ICONS.info, 26)}<span class="t">нода не найдена</span><span class="s">Нода <b>${esc(pathId)}</b> не найдена в пуле (или уже удалена).</span></div><div class="card-foot"><a class="btn sm" href="/statistics">← к списку нод</a></div></div>`;
      } else {
        $("root").innerHTML = `<div class="card"><div class="empty-state">${icon(ICONS.info, 26)}<span class="t">не удалось загрузить данные</span><span class="s">${esc(e.message || e)}</span></div></div>`;
      }
      pill.className = "status-pill off";
      $("upd").textContent = "ошибка обновления";
    }
    window.scrollTo(0, y);
  }
  initTheme();
  refreshCurrent();
  setInterval(refreshCurrent, 15e3);
})();
</script>
</body>
</html>
