<svg xmlns="http://www.w3.org/2000/svg" width="400" height="108" viewBox="0 0 400 108" role="img" aria-label="sharedd">
  <defs>
    <linearGradient id="ddgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#22d3ee;#6366f1" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#6366f1;#8b5cf6;#22d3ee" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glowW" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="396" height="104" rx="17" fill="#0a0f1a" stroke="rgba(148,163,184,.22)" stroke-width="1"/>
  <rect x="2.5" y="2.5" width="395" height="34" rx="16.5" fill="rgba(255,255,255,.03)" stroke="none"/>

  <g font-family='-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-weight="800" font-size="54" letter-spacing="-1">
    <text x="78" y="79" fill="#ffffff" opacity=".45" filter="url(#glowW)">share</text>
    <text x="78" y="79" fill="#f8fafc">share</text>
    <g transform="translate(0,0) skewX(-9)">
      <text x="250" y="79" fill="url(#ddgrad)" opacity=".55" filter="url(#glowD)">dd</text>
      <text x="250" y="79" fill="url(#ddgrad)">dd</text>
    </g>
  </g>
</svg>
